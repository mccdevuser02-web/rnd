<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>80s BREAKOUT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
        
        .game-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 4px solid #ff00ff;
            box-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
            background: #000;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            background: #000;
        }
        
        .title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 36px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            animation: pulse 1.5s infinite;
        }
        
        .score-container {
            position: absolute;
            top: 70px;
            left: 20px;
            font-size: 20px;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }
        
        .lives-container {
            position: absolute;
            top: 70px;
            right: 20px;
            font-size: 20px;
            color: #ffff00;
            text-shadow: 0 0 5px #ffff00;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 16px;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
        
        .start-screen, .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
        }
        
        .game-over-screen {
            display: none;
        }
        
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            letter-spacing: 3px;
        }
        
        h2 {
            font-size: 36px;
            margin-bottom: 30px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }
        
        .btn {
            background: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 12px 30px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 10px #00ff00;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
        }
        
        .instructions {
            max-width: 80%;
            margin: 20px 0;
            line-height: 1.6;
            text-align: center;
            color: #ffff00;
        }
        
        .pixel {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ff00;
            box-shadow: 0 0 5px #00ff00;
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        .blink {
            animation: blink 0.5s infinite;
        }
        
        .brick {
            position: absolute;
            border: 1px solid #000;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="title">80s BREAKOUT</div>
        <div class="score-container">SCORE: <span id="score">0</span></div>
        <div class="lives-container">LIVES: <span id="lives">3</span></div>
        
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="controls">CONTROLS: ← → to move paddle</div>
        
        <div class="start-screen" id="startScreen">
            <h1>80s BREAKOUT</h1>
            <div class="instructions">
                <p>Break all the bricks without losing the ball!</p>
                <p>Use arrow keys to move the paddle.</p>
                <p>Each brick broken gives points.</p>
                <p>Don't let the ball fall!</p>
            </div>
            <button class="btn" id="startBtn">START GAME</button>
        </div>
        
        <div class="game-over-screen" id="gameOverScreen">
            <h2>GAME OVER</h2>
            <div class="instructions">
                <p>FINAL SCORE: <span id="finalScore">0</span></p>
            </div>
            <button class="btn" id="restartBtn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Game elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const finalScoreElement = document.getElementById('finalScore');
        
        // Game variables
        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let animationId;
        
        // Paddle
        const paddle = {
            width: 100,
            height: 15,
            x: canvas.width / 2 - 50,
            y: canvas.height - 30,
            speed: 8,
            dx: 0
        };
        
        // Ball
        const ball = {
            radius: 10,
            x: canvas.width / 2,
            y: canvas.height / 2,
            speed: 5,
            dx: 4,
            dy: -4
        };
        
        // Bricks
        const brick = {
            rows: 5,
            cols: 10,
            width: 75,
            height: 20,
            padding: 10,
            offsetTop: 60,
            offsetLeft: 30,
            colors: ['#ff0000', '#ff8000', '#ffff00', '#00ff00', '#00ffff']
        };
        
        // Create bricks
        let bricks = [];
        function createBricks() {
            bricks = [];
            for (let r = 0; r < brick.rows; r++) {
                for (let c = 0; c < brick.cols; c++) {
                    bricks.push({
                        x: c * (brick.width + brick.padding) + brick.offsetLeft,
                        y: r * (brick.height + brick.padding) + brick.offsetTop,
                        status: 1,
                        color: brick.colors[r]
                    });
                }
            }
        }
        
        // Draw paddle
        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.fillStyle = '#00ff00';
            ctx.fill();
            ctx.closePath();
            
            // Add neon effect
            ctx.beginPath();
            ctx.rect(paddle.x - 2, paddle.y - 2, paddle.width + 4, paddle.height + 4);
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        
        // Draw ball
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffff00';
            ctx.fill();
            ctx.closePath();
            
            // Add glow effect
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius + 5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
            ctx.fill();
            ctx.closePath();
        }
        
        // Draw bricks
        function drawBricks() {
            bricks.forEach(b => {
                if (b.status === 1) {
                    ctx.beginPath();
                    ctx.rect(b.x, b.y, brick.width, brick.height);
                    ctx.fillStyle = b.color;
                    ctx.fill();
                    ctx.closePath();
                    
                    // Add brick border
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            });
        }
        
        // Move paddle
        function movePaddle() {
            paddle.x += paddle.dx;
            
            // Wall collision
            if (paddle.x < 0) {
                paddle.x = 0;
            } else if (paddle.x + paddle.width > canvas.width) {
                paddle.x = canvas.width - paddle.width;
            }
        }
        
        // Move ball
        function moveBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // Wall collision (left/right)
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }
            
            // Wall collision (top)
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }
            
            // Paddle collision
            if (
                ball.y + ball.radius > paddle.y &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width
            ) {
                // Change ball direction based on where it hits the paddle
                const hitPosition = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                ball.dx = hitPosition * 5;
                ball.dy = -Math.abs(ball.dy);
            }
            
            // Bottom wall - lose life
            if (ball.y + ball.radius > canvas.height) {
                lives--;
                livesElement.textContent = lives;
                
                if (lives <= 0) {
                    gameOver();
                } else {
                    // Reset ball position
                    ball.x = canvas.width / 2;
                    ball.y = canvas.height / 2;
                    ball.dx = 4;
                    ball.dy = -4;
                }
            }
            
            // Brick collision
            bricks.forEach(b => {
                if (b.status === 1) {
                    if (
                        ball.x > b.x &&
                        ball.x < b.x + brick.width &&
                        ball.y > b.y &&
                        ball.y < b.y + brick.height
                    ) {
                        ball.dy = -ball.dy;
                        b.status = 0;
                        score += 10;
                        scoreElement.textContent = score;
                    }
                }
            });
        }
        
        // Draw everything
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw game elements
            drawBricks();
            drawPaddle();
            drawBall();
            
            // Draw grid background
            drawGrid();
        }
        
        // Draw grid background
        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.05)';
            ctx.lineWidth = 1;
            
            // Vertical lines
            for (let x = 0; x < canvas.width; x += 20) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            // Horizontal lines
            for (let y = 0; y < canvas.height; y += 20) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        
        // Update game state
        function update() {
            if (!gameRunning) return;
            
            movePaddle();
            moveBall();
            draw();
            
            // Check if all bricks are broken
            const allBricksBroken = bricks.every(b => b.status === 0);
            if (allBricksBroken) {
                score += 100;
                scoreElement.textContent = score;
                gameOver(true);
            }
            
            animationId = requestAnimationFrame(update);
        }
        
        // Start game
        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            gameRunning = true;
            score = 0;
            lives = 3;
            scoreElement.textContent = score;
            livesElement.textContent = lives;
            createBricks();
            resetBall();
            update();
        }
        
        // Reset ball position
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = 4;
            ball.dy = -4;
        }
        
        // Game over
        function gameOver(isWin = false) {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            
            if (isWin) {
                finalScoreElement.textContent = score;
                gameOverScreen.innerHTML = `
                    <h2>YOU WIN!</h2>
                    <div class="instructions">
                        <p>FINAL SCORE: <span id="finalScore">${score}</span></p>
                    </div>
                    <button class="btn" id="restartBtn2">PLAY AGAIN</button>
                `;
                document.getElementById('restartBtn2').addEventListener('click', startGame);
            } else {
                finalScoreElement.textContent = score;
            }
            
            gameOverScreen.style.display = 'flex';
        }
        
        // Event listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                paddle.dx = paddle.speed;
            } else if (e.key === 'ArrowLeft') {
                paddle.dx = -paddle.speed;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                paddle.dx = 0;
            }
        });
        
        // Initialize
        createBricks();
        draw();
        
        // Create background pixels
        function createBackgroundPixels() {
            const pixelCount = 200;
            for (let i = 0; i < pixelCount; i++) {
                const pixel = document.createElement('div');
                pixel.className = 'pixel';
                pixel.style.left = `${Math.random() * 100}%`;
                pixel.style.top = `${Math.random() * 100}%`;
                pixel.style.width = `${Math.random() * 4 + 2}px`;
                pixel.style.height = pixel.style.width;
                pixel.style.opacity = Math.random() * 0.7 + 0.3;
                document.querySelector('.game-container').appendChild(pixel);
            }
        }
        
        createBackgroundPixels();
    </script>
</body>
</html>
